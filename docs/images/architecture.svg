<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">QNAP AI Control architecture</title>
  <desc id="desc">Mac AI clients connect through a local MCP bridge to a QNAP control agent with authentication, allowlists, audit logging, and QPKG/file/command adapters.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #d4dae2; stroke-width: 2; rx: 8; }
      .title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .label { font: 600 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243447; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5b6b; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #44515f; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .guard { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 8; }
      .risk { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <text class="title" x="48" y="54">QNAP AI Control Suite</text>
  <text class="small" x="48" y="82">Controlled NAS operations for Codex, OpenClaw, Hermes, and MCP clients</text>

  <rect class="panel" x="48" y="125" width="260" height="250"/>
  <text class="label" x="76" y="165">Mac AI Clients</text>
  <text class="small" x="76" y="204">Codex</text>
  <text class="small" x="76" y="232">OpenClaw</text>
  <text class="small" x="76" y="260">Hermes</text>
  <text class="small" x="76" y="288">Any MCP client</text>

  <rect class="panel" x="390" y="125" width="270" height="250"/>
  <text class="label" x="420" y="165">Mac MCP Bridge</text>
  <text class="mono" x="420" y="204">qnap-ai-control-mcp</text>
  <text class="small" x="420" y="236">stdio MCP tools</text>
  <text class="small" x="420" y="264">Bearer token</text>
  <text class="small" x="420" y="292">prepare / confirm gate</text>

  <rect class="panel" x="742" y="82" width="360" height="336"/>
  <text class="label" x="772" y="122">QNAP Agent</text>
  <text class="mono" x="772" y="154">qnap-ai-control-agent</text>
  <rect class="guard" x="772" y="180" width="300" height="52"/>
  <text class="small" x="792" y="212">Auth, path roots, command allowlist</text>
  <rect class="risk" x="772" y="252" width="300" height="52"/>
  <text class="small" x="792" y="284">Sensitive operation confirmation</text>
  <text class="small" x="772" y="340">Adapters: files, QPKG, getcfg, ps, df</text>
  <text class="small" x="772" y="368">Audit: /var/log/qnap-ai-control-agent</text>

  <path class="arrow" d="M 308 250 C 340 250 352 250 390 250"/>
  <path class="arrow" d="M 660 250 C 700 250 710 250 742 250"/>
  <text class="small" x="334" y="236">MCP</text>
  <text class="small" x="680" y="236">HTTP LAN</text>

  <rect class="panel" x="165" y="415" width="870" height="60"/>
  <text class="small" x="196" y="450">Default stance: no public exposure, no shell execution, no broad filesystem writes, every sensitive action can be reviewed before execution.</text>
</svg>

