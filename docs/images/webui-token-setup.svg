<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">WebUI token setup</title>
  <desc id="desc">Token is copied from the NAS token file into WebUI local storage and then sent as a Bearer header to API requests.</desc>
  <rect width="960" height="420" rx="18" fill="#0d141b"/>
  <rect x="36" y="44" width="250" height="150" rx="12" fill="#151f2a" stroke="#314357" stroke-width="2"/>
  <text x="161" y="88" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="700">NAS</text>
  <text x="161" y="124" fill="#bdc8d5" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">initial-token.txt</text>
  <rect x="82" y="146" width="158" height="26" rx="5" fill="#0b1118" stroke="#2b3b4d"/>
  <text x="161" y="165" fill="#36d399" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">copy token</text>

  <rect x="355" y="44" width="250" height="150" rx="12" fill="#151f2a" stroke="#314357" stroke-width="2"/>
  <text x="480" y="82" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="700">WebUI</text>
  <text x="480" y="116" fill="#bdc8d5" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Bearer token input</text>
  <rect x="395" y="140" width="170" height="34" rx="6" fill="#0b1118" stroke="#40556c"/>
  <circle cx="419" cy="157" r="4" fill="#bdc8d5"/>
  <circle cx="438" cy="157" r="4" fill="#bdc8d5"/>
  <circle cx="457" cy="157" r="4" fill="#bdc8d5"/>
  <circle cx="476" cy="157" r="4" fill="#bdc8d5"/>
  <circle cx="495" cy="157" r="4" fill="#bdc8d5"/>

  <rect x="674" y="44" width="250" height="150" rx="12" fill="#151f2a" stroke="#314357" stroke-width="2"/>
  <text x="799" y="82" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="700">Agent API</text>
  <text x="799" y="116" fill="#bdc8d5" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">/v1/health</text>
  <rect x="721" y="140" width="156" height="34" rx="6" fill="#123b2b" stroke="#1b9468"/>
  <text x="799" y="163" fill="#74f0a7" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Authorization OK</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L12,4 z" fill="#64b5f6"/>
    </marker>
  </defs>
  <path d="M292 119 H348" stroke="#64b5f6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M611 119 H667" stroke="#64b5f6" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="320" y="101" fill="#bdc8d5" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">paste</text>
  <text x="639" y="101" fill="#bdc8d5" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Bearer</text>

  <rect x="130" y="260" width="700" height="92" rx="12" fill="#101923" stroke="#314357" stroke-width="2"/>
  <text x="480" y="300" fill="#f5c451" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="700">安全边界</text>
  <text x="480" y="330" fill="#bdc8d5" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">WebUI 只把 token 存在当前浏览器 localStorage；服务端仍使用 config.json 中的 token hash 校验。</text>
</svg>
